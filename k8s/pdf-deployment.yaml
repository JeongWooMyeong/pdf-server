apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-server-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: pdf-server

  template:
    metadata:
      labels:
        app: pdf-server

    spec:
      containers:
        - name: pdf-server
          image: jeongwoomyeong/pdf-server:latest

          ports:
            - containerPort: 9999

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "1Gi"
